<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amethyst</title>
<link rel="icon" href="assets/amethyst.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="topbar">
    <div class="brand"><span class="gem"></span> AMETHYST</div>
    <button id="reset">Reset World</button>
  </div>
  <div class="stats">
    <div class="panel hearts" id="hearts"></div>
    <div class="panel coords" id="coords"></div>
    <div class="panel time" id="time"></div>
  </div>
  <div class="hotbar" id="hotbar"></div>
</div>
<div id="crosshair"></div>
<script src="js/main.js"></script>
</body>
</html>
